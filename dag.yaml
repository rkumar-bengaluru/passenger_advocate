version: "1.0"

nodes:
  - id: sql_query
    type: tool
    name: get_flight_status
    description: >
      Query flight status from hive_metastore.default.ontime_cleaned.
      Inputs: airline_code, flight_number, flight_date.
      Outputs: Cancelled, Diverted, ArrDelayMinutes, DepDelayMinutes.
    inputs:
      - airline_code
      - flight_number
      - flight_date
    outputs:
      - Cancelled
      - Diverted
      - ArrDelayMinutes
      - DepDelayMinutes

  - id: policy_retriever
    type: retriever
    name: get_policy_context
    description: >
      Retrieve airline commitments from policies.md relevant to cancellations or delays.
      Input: status string (Cancelled, Delayed, Diverted, On time).
      Output: policy_snippet.
    inputs:
      - status
    outputs:
      - policy_snippet

  - id: synthesizer
    type: llm
    name: answer_synthesis
    description: >
      Combine structured flight status with policy commitments into a natural language answer.
    inputs:
      - Cancelled
      - Diverted
      - ArrDelayMinutes
      - DepDelayMinutes
      - policy_snippet
    outputs:
      - final_answer

edges:
  - from: sql_query
    to: synthesizer
  - from: policy_retriever
    to: synthesizer
